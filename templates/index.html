<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        :root {
            /* Notion Color Palette */
            --bg-color: #FFFFFF;
            --text-main: #37352F;
            --text-secondary: #9B9A97;
            --hover-bg: #EFEFED; /* The specific grey Notion uses on hover */
            --border-color: #E9E9E7;
            --checkbox-border: #37352F;
            --link-blue: #2383E2;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            padding-top: 80px;
            -webkit-font-smoothing: antialiased; /* Makes font crisp */
        }

        .page-container {
            width: 100%;
            max-width: 700px; /* Notion documents are usually 700-900px wide */
            padding: 0 20px;
        }

        /* --- Header Styling --- */
        .header {
            margin-bottom: 40px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .cover-icon {
            font-size: 78px;
            margin-bottom: 10px;
            display: block;
        }

        h1 {
            font-weight: 700;
            font-size: 40px;
            margin: 0;
            color: var(--text-main);
            letter-spacing: -1px;
        }

        /* --- Input Form (The "New Task" block) --- */
        .add-task-form {
            display: flex;
            align-items: center;
            padding: 8px 4px;
            margin-bottom: 20px;
            color: var(--text-secondary);
            transition: color 0.2s;
        }

        .add-task-form:focus-within {
            color: var(--text-main);
        }

        .plus-icon {
            font-size: 20px;
            margin-right: 12px;
            color: inherit;
        }

        input[type="text"] {
            border: none;
            outline: none;
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            width: 100%;
            background: transparent;
            color: var(--text-main);
        }

        input[type="text"]::placeholder {
            color: var(--text-secondary);
            font-weight: 400;
        }

        /* Hide the actual submit button to keep it clean (Enter key works) */
        button[type="submit"] {
            display: none;
        }

        /* --- Task List --- */
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            display: flex;
            align-items: flex-start; /* Aligns items to top for multiline text */
            padding: 6px 4px;
            border-radius: 4px;
            margin-bottom: 2px;
            transition: background 0.1s;
            group: task-row; /* Used for hover logic */
        }

        li:hover {
            background-color: var(--hover-bg);
        }

        /* --- Custom Checkbox Logic --- */
        .checkbox-link {
            text-decoration: none;
            margin-right: 12px;
            margin-top: 3px; /* visual alignment */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* The Box */
        .checkbox-box {
            width: 16px;
            height: 16px;
            border: 2px solid var(--text-main); /* Dark border */
            border-radius: 3px; /* Slightly rounded corners */
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, border 0.2s;
        }

        /* Checked State */
        .checked .checkbox-box {
            background-color: var(--link-blue);
            border-color: var(--link-blue);
        }

        .checked .checkbox-box i {
            color: white;
            font-size: 12px;
            font-weight: bold;
        }

        /* Unchecked State */
        .unchecked .checkbox-box i {
            display: none;
        }

        .unchecked .checkbox-box:hover {
            background-color: #E2E2E0; /* Subtle hover on checkbox */
        }

        /* --- Task Text --- */
        .task-text {
            flex-grow: 1;
            font-size: 16px;
            line-height: 1.5;
            color: var(--text-main);
            word-break: break-word;
        }

        .task-text.done {
            text-decoration: line-through;
            color: var(--text-secondary);
        }

        /* --- Delete Button (Hidden by default) --- */
        .delete-btn {
            opacity: 0; /* Hidden */
            color: var(--text-secondary);
            text-decoration: none;
            padding: 4px;
            border-radius: 4px;
            transition: opacity 0.2s, background 0.2s;
            font-size: 18px;
            display: flex;
            align-items: center;
        }

        /* Only show delete button when hovering the ROW (li) */
        li:hover .delete-btn {
            opacity: 1;
        }

        .delete-btn:hover {
            background-color: #D3D1CB;
            color: #EB5757;
        }

    </style>
</head>
<body>

    <div class="page-container">

        <div class="header">
            <span class="cover-icon">🥥</span>
            <h1>Task Board</h1>
        </div>

        <ul>
            {% for task in tasks %}
            <li>
                {% if task.done %}
                    <a href="/complete/{{ loop.index0 }}" class="checkbox-link checked">
                        <div class="checkbox-box"><i class="ph-bold ph-check"></i></div>
                    </a>
                {% else %}
                    <a href="/complete/{{ loop.index0 }}" class="checkbox-link unchecked">
                        <div class="checkbox-box"><i></i></div>
                    </a>
                {% endif %}

                <span class="task-text {{ 'done' if task.done else '' }}">
                    {{ task.title }}
                </span>

                <a href="/delete/{{ loop.index0 }}" class="delete-btn" title="Delete">
                    <i class="ph ph-trash"></i>
                </a>
            </li>
            {% endfor %}
        </ul>

        <form action="/add" method="POST" class="add-task-form">
            <i class="ph ph-plus plus-icon"></i>
            <input type="text" name="title" placeholder="New task..." autocomplete="off" required>
            <button type="submit">Add</button>
        </form>

        {% if not tasks %}
        <p style="color: var(--text-secondary); margin-left: 36px; font-size: 14px;">
            Nothing to do. Press Enter to add a task.
        </p>
        {% endif %}

    </div>

</body>
</html>
