<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Task Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #4f46e5;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --bg-color: #f9fafb;
            --text-color: #1f2937;
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            background: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            padding-top: 50px;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 450px;
        }

        h2 {
            margin-top: 0;
            font-weight: 600;
            text-align: center;
            color: #111827;
        }

        /* Form Styling */
        form {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
        }

        button {
            padding: 12px 20px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }

        button:hover { opacity: 0.9; }
        button:active { transform: scale(0.95); }

        /* Task List Styling */
        ul { list-style: none; padding: 0; margin: 0; }

        li {
            padding: 14px;
            background: #fff;
            border: 1px solid #f3f4f6;
            border-radius: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }

        li:hover { background: #fbfbfb; }

        .task-text { font-size: 16px; flex-grow: 1; margin-right: 10px; }
        .done { text-decoration: line-through; color: #9ca3af; }

        /* Action Buttons */
        .actions { display: flex; gap: 8px; }

        .actions a {
            text-decoration: none;
            font-size: 18px;
            padding: 5px;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .btn-complete:hover { background: #d1fae5; }
        .btn-delete:hover { background: #fee2e2; }

    </style>
</head>
<body>
    <div class="container">
        <h2>✅ Task Manager</h2>

        <form action="/add" method="POST">
            <input type="text" name="title" placeholder="What's the plan?" required>
            <button type="submit">Add Task</button>
        </form>

        <ul>
            {% for task in tasks %}
            <li>
                <span class="task-text {{ 'done' if task.done else '' }}">
                    {{ task.title }}
                </span>
                <div class="actions">
                    {% if not task.done %}
                    <a href="/complete/{{ loop.index0 }}" class="btn-complete" title="Mark as Done">✔️</a>
                    {% endif %}
                    <a href="/delete/{{ loop.index0 }}" class="btn-delete" title="Delete Task">🗑️</a>
                </div>
            </li>
            {% endfor %}
        </ul>

        {% if not tasks %}
        <p style="text-align: center; color: #9ca3af;">No tasks yet. Add one above!</p>
        {% endif %}
    </div>
</body>
</html>
